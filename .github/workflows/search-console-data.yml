name: Search Console data

on:
  workflow_dispatch:
  schedule:
    - cron: "5 9 * * 0"
      timezone: "Europe/Paris"

permissions:
  contents: write
  id-token: write

concurrency:
  group: search-console-data
  cancel-in-progress: false

jobs:
  fetch-search-console:
    name: Fetch Search Console data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate repository variables
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
        run: |
          test -n "$GCP_WIF_PROVIDER" || { echo "GCP_WIF_PROVIDER is missing."; exit 1; }
          test -n "$GCP_SERVICE_ACCOUNT" || { echo "GCP_SERVICE_ACCOUNT is missing."; exit 1; }
          test -n "$GSC_SITE_URL" || { echo "GSC_SITE_URL is missing."; exit 1; }
          case "$GSC_SITE_URL" in
            sc-domain:*) ;;
            *) echo "GSC_SITE_URL must use the sc-domain:example.com format."; exit 1 ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud without a JSON key
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: false
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly

      - name: Fetch finalized Search Console data
        env:
          GSC_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
        run: npm run seo:fetch-search-console

      - name: Commit the latest data to main
        run: |
          git add -- data/seo/search-console/latest.json
          if git diff --cached --quiet; then
            echo "Search Console data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Search Console data"
          git pull --rebase origin main
          git push origin HEAD:main
